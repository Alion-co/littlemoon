name: little_moon
description: "Little Moon — private, offline menstrual cycle tracker"
publish_to: "none"

version: 2.0.0+4

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Offline key-value storage (Android + Web)
  shared_preferences: ^2.3.2

  # Local (offline) notifications
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.0

  # Date & Localization
  intl: any

  # UI
  flutter_animate: ^4.5.2

  # App lock: fingerprint + hashed PIN
  local_auth: any
  crypto: any

  # Android home screen widget
  home_widget: any

  # Doctor report (PDF) and sharing it
  pdf: any
  printing: any

  # Backup files (save / open .json)
  file_picker: any

  # About page: call, email, Instagram and store links
  url_launcher: any

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

  # App icon generator
  flutter_launcher_icons: ^0.14.1

# فایل‌های طراحی (نسخه‌ی کامل ۱۰۲۴ و لایه‌ی foreground) داخل design/
# هستند و وارد APK نمی‌شوند.
# بعد از هر تغییر در تصویر آیکون:
# dart run flutter_launcher_icons

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "design/littlemoon_icon_full.png"
  adaptive_icon_background: "#E2D1EC"
  adaptive_icon_foreground: "design/littlemoon_icon_foreground.png"
  web:
    generate: true
    image_path: "design/littlemoon_icon_full.png"
    background_color: "#E2D1EC"
    theme_color: "#D84D88"

flutter:
  generate: true
  uses-material-design: true

  # فقط فایل‌ها و پوشه‌های موردنیاز runtime
  # فایل‌های design/ وارد APK نمی‌شوند

  assets:
    - assets/images/logo/littlemoon_icon_full.png
    - assets/images/logo/alion_badge.png
    - assets/images/logo/moon_emblem.png
    - assets/avatars/

  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
        - asset: assets/fonts/Vazirmatn-Medium.ttf
          weight: 500
        - asset: assets/fonts/Vazirmatn-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700

    # فونت نوشته‌ی لوگو (فقط در Splash Screen)
    - family: CormorantGaramond
      fonts:
        - asset: assets/fonts/CormorantGaramond-SemiBold.ttf
          weight: 600