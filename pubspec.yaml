name: little_moon
description: "Little Moon — Smart period cycle app"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Local Database - Drift + SQLite
  drift: ^2.28.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.5

  # Offline key-value storage (Android + Web)
  shared_preferences: ^2.3.2

  # Local (offline) notifications
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.0

  # Date & Localization
  intl: any

  # UI
  flutter_animate: ^4.5.2
  table_calendar: ^3.1.3

  # Models
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

  # Code Generation
  build_runner: ^2.4.13
  drift_dev: ^2.28.0
  freezed: ^2.5.2
  json_serializable: ^6.8.0

  # App icon generator
  flutter_launcher_icons: ^0.14.1

# بعد از هر تغییر در تصویر آیکون:  dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/logo/littlemoon_icon_full.png"
  adaptive_icon_background: "#E2D1EC"
  adaptive_icon_foreground: "assets/images/logo/littlemoon_icon_foreground.png"
  web:
    generate: true
    image_path: "assets/images/logo/littlemoon_icon_full.png"
    background_color: "#E2D1EC"
    theme_color: "#D84D88"

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/
    - assets/images/logo/

  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
        - asset: assets/fonts/Vazirmatn-Medium.ttf
          weight: 500
        - asset: assets/fonts/Vazirmatn-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700
